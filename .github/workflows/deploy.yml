# Downloads the latest 311 data, builds the site, and publishes it to GitHub Pages.
# One-time setup: in the repo's Settings → Pages, set "Source" to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # merges to main (the default branch on GitHub)
  workflow_dispatch: # "Run workflow" button in the Actions tab, e.g. to refresh the data

permissions:
  contents: read
  pages: write # to publish
  id-token: write # to verify the deployment came from this workflow

# Run one deployment at a time; let an in-progress one finish rather than cancel it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download 311 data
        run: npm run fetch-data
        env:
          # Optional repo secret; without it the download uses the shared anonymous rate limit.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

      - run: npm run lint

      # Type-checks, then builds dist/ with the data included (see vite.config.ts).
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
