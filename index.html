<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lake Merritt 311 Requests</title>
<link rel="icon" type="image/svg+xml" href="/src/assets/lake-merritt.svg">
<!-- Inter for text and Raleway for headings (see --font-sans and --font-display in styles.css). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Raleway:wght@600;700&display=swap">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body class="bg-page p-4 font-sans text-ink sm:p-6">
<!-- Centered and capped at 1440px so wide monitors don't stretch the tables and charts. -->
<div class="mx-auto max-w-[90rem]">

<header class="mb-4 flex flex-wrap items-end justify-between gap-x-4 gap-y-1">
  <div class="flex items-center gap-3">
    <!-- The park, lake, and bird islands, drawn from data/shapes. Decorative: the heading names it. -->
    <img src="/src/assets/lake-merritt.svg" alt="" class="h-16 w-auto shrink-0 lg:h-20">
    <div>
      <h1 class="text-3xl font-semibold lg:text-4xl">Lake Merritt 311 Requests</h1>
      <p class="text-sm text-muted">Oakland 311 service requests around Lake Merritt</p>
    </div>
  </div>
  <!-- When the city last updated the data; filled in by main.ts once the data loads. -->
  <p id="data-as-of" class="text-xs text-muted" hidden></p>
</header>

<main class="space-y-6">
  <p id="status" role="status" class="text-sm text-muted">Loading data&hellip;</p>
  <!-- Shown by main.ts when the city's data is more than a day old. -->
  <p id="stale-data" class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-2 text-sm text-amber-900" hidden></p>
  <!-- Widgets stay hidden until main.ts has data to render into them. -->
  <dl id="stats" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4" hidden></dl>
  <!-- The two issue tables. Each starts collapsed with its own "See all" (see barTable.ts).
       Side by side (lg+) they sit in one tray with a shared "See all" that expands both;
       stacked, there's no tray and each card keeps its own button. -->
  <div id="issues" class="group/issues lg:relative lg:rounded-lg lg:border lg:border-line lg:bg-well lg:p-4" hidden>
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-2 lg:gap-4">
      <section id="top-issues" class="panel relative p-4" hidden></section>
      <section id="issues-resolved" class="panel relative p-4" hidden></section>
    </div>
    <!-- Sits on the tray's bottom edge, over the faded rows, so it takes no space of its own.
         Only on lg+, and only while a card is still collapsed. -->
    <button id="issues-expand" type="button" class="absolute bottom-2 left-1/2 hidden -translate-x-1/2 rounded-full border border-line bg-panel px-3 py-0.5 text-xs font-medium shadow-sm hover:bg-page lg:group-has-[[data-collapsed]]/issues:block"></button>
  </div>
  <section id="map" class="panel p-4" hidden></section>
  <!-- The charts and their shared legend, grouped in one tray with the charts as nested cards. -->
  <div id="charts" class="space-y-3 rounded-lg border border-line bg-well p-3 sm:p-4" hidden>
    <!-- One legend for both charts: they share topics and colors. Click to show or hide a topic. -->
    <ul id="chart-legend" class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-muted" aria-label="Show or hide topics in both charts" hidden></ul>
    <!-- Side by side on wide (1200px+) windows. -->
    <div class="grid grid-cols-1 gap-3 sm:gap-4 wide:grid-cols-2">
      <section id="chart-category" class="panel p-4" hidden></section>
      <section id="chart-weekly" class="panel p-4" hidden></section>
    </div>
  </div>
  <section id="recent-requests" class="panel py-3" hidden></section>
</main>

</div>
<script type="module" src="/src/main.ts"></script>

</body>
</html>
